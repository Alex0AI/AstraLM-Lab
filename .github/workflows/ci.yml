name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m compileall -q src tests
      - run: astralm doctor
      - run: astralm estimate --preset pico --batch-size 2 --sequence-length 128
      - run: astralm verify-cache --preset pico
      - run: pytest --durations=10
