name: Cloud Public Text Ablation
on:
  workflow_dispatch:
    inputs:
      preset:
        description: Model preset
        type: choice
        options:
          - pico
          - tiny
        default: pico
      steps:
        description: Training steps per run
        default: "40"
        required: true
      max_bytes:
        description: Maximum public-corpus bytes to download
        default: "750000"
        required: true
      seeds:
        description: Comma-separated seeds
        default: "17,42,73"
        required: true

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: >-
          python scripts/prepare_public_data.py tinyshakespeare
          --max-bytes "${{ inputs.max_bytes }}"
      - run: >-
          astralm ablate --preset "${{ inputs.preset }}"
          --corpus data/public_sample.txt --output runs/public-text
          --steps "${{ inputs.steps }}" --batch-size 8 --seq-len 64
          --eval-interval 10 --eval-batches 5 --seeds "${{ inputs.seeds }}"
      - name: Add report to workflow summary
        run: cat runs/public-text/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: astralm-public-text-ablation-${{ inputs.preset }}
          path: |
            runs/public-text/
            data/public_sample.meta.json
          retention-days: 30
          if-no-files-found: error
