name: Bug report
description: Report a reproducible defect in the model, cache, training, or tooling.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping make AstraLM more trustworthy.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      render: shell
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `astralm doctor` plus your OS and Python version.
      render: json
    validations:
      required: true
